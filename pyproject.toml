[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[project]
name = "splanything"
version = "0.1.0"
description = "Splat any differentiable function."
readme = "README.md"
requires-python = ">=3.10, <3.14"
license = { text = "MIT" }
authors = [
    {name = "Thomas Peschlow"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Artists",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Machine Learning",
    "Topic :: Scientific/Engineering :: Graphics",
]
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "pillow",
    "jaxtyping",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/CyWP/splanything/README.md"
Repository = "https://github.com/CyWP/splanything"
Issues = "https://github.com/CyWP/splanything/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
ignore = ["F722", "F821"]