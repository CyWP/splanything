[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "splanything"
version = "0.1.0"
description = "2d splat any differentiable function."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "pillow",
    "pyyaml",
    "jaxtyping",
    "einops",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
splanything = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["splanything*"]
